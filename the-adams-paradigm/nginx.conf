server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve the matching static asset if one exists,
    # otherwise fall back to index.html so routes like /terms resolve
    # correctly on a direct visit or a page refresh, not just via
    # client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite, so they're safe to cache
    # aggressively; index.html itself must always be revalidated.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
